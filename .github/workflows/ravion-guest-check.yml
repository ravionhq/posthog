name: Ravion guest image check
on:
    pull_request:
jobs:
    check:
        runs-on: ravion/ee=openclaw-bench/type=sandbox/cpu=2/memory=8/interruptible=true/id=${{ github.run_id }}-${{ github.run_attempt }}-check-0
        steps:
            - name: apt assume-yes
              run: cat /etc/apt/apt.conf.d/90assumeyes
            - name: docker compose
              run: |
                  dpkg -l | grep -E 'docker|compose|buildx' || true
                  ls -la /usr/libexec/docker/cli-plugins /usr/lib/docker/cli-plugins /usr/local/lib/docker/cli-plugins 2>&1 || true
                  echo DOCKER_CONFIG=$DOCKER_CONFIG; ls -la $DOCKER_CONFIG $DOCKER_CONFIG/cli-plugins 2>&1 || true
                  docker buildx version || true
                  docker compose version
            - name: guest facts
              if: always()
              run: |
                  cat /etc/os-release | head -2; docker version --format '{{.Server.Version}}' || true
                  ls -la /etc/ravion/boot 2>&1 | head; cat /etc/ravion/* 2>/dev/null | head -20; uname -a; stat -c '%y %n' /usr/bin/docker /var/lib/dpkg/status
