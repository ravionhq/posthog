name: Ravion guest image check
on:
    pull_request:
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: GitHub-hosted memory, swap and tmp baseline
              run: |
                  nproc; free -m; swapon --show
                  df -h /tmp /dev/shm /
                  mount | grep -E ' /tmp | /dev/shm | / ' || true
                  cat /proc/sys/vm/overcommit_memory /proc/sys/vm/swappiness
