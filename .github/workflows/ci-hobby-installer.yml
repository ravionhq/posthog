name: Hobby Installer

on:
    pull_request:
        paths:
            - '.github/workflows/ci-hobby-installer.yml'
            - 'bin/hobby-installer/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Checkout code
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: bin/hobby-installer

            - name: Set up Go
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: bin/hobby-installer/go.sum

            - name: Run golangci-lint
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: golangci/golangci-lint-action@v9.2.0
              with:
                  version: v2.13.1
                  working-directory: bin/hobby-installer
                  args: --timeout=5m

            - name: Run tests
              run: cd bin/hobby-installer && make test

    build:
        runs-on: ${{ startsWith((matrix.runner), 'depot-ubuntu') && format('{0}/id={1}-{2}-ci-hobby-installer-build-{3}', ((matrix.runner) == 'depot-ubuntu-24.04' && 'ravion/ee=posthog-bench/type=sandbox/cpu=2/memory=8/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-24.04-4' && 'ravion/ee=posthog-bench/type=sandbox/cpu=4/memory=16/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-24.04-8' && 'ravion/ee=posthog-bench/type=sandbox/cpu=8/memory=32/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-24.04-16' && 'ravion/ee=posthog-bench/type=sandbox/cpu=16/memory=64/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-24.04-32' && 'ravion/ee=posthog-bench/type=sandbox/cpu=32/memory=128/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-22.04' && 'ravion/ee=posthog-bench/type=sandbox/cpu=2/memory=8/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-22.04-4' && 'ravion/ee=posthog-bench/type=sandbox/cpu=4/memory=16/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-22.04-8' && 'ravion/ee=posthog-bench/type=sandbox/cpu=8/memory=32/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-22.04-16' && 'ravion/ee=posthog-bench/type=sandbox/cpu=16/memory=64/disk=80/image=github-ubuntu-24' || (matrix.runner) == 'depot-ubuntu-22.04-32' && 'ravion/ee=posthog-bench/type=sandbox/cpu=32/memory=128/disk=80/image=github-ubuntu-24'), github.run_id, github.run_attempt, strategy.job-index) || (matrix.runner) }}
        timeout-minutes: 10
        strategy:
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64

        steps:
            - name: Checkout code
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: bin/hobby-installer

            - name: Set up Go
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: bin/hobby-installer/go.sum

            - name: Build
              run: cd bin/hobby-installer && make build
